<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ede0c4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221812" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Brumelune : combine les éléments et fais naître un monde." />
    <title>Brumelune</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Brumelune" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..600&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <!-- L'écran de démarrage (#splash, src/utils/splash.js) : visible dès les premiers octets, avant le code du jeu -->
    <style>
      .splash { position: fixed; inset: 0; z-index: 10000; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px 16px; background: radial-gradient(circle at 50% 38%, #fffcf5, #f4ead5 62%, #e8d8b8); color: #34241a; font-family: 'Nunito', ui-rounded, system-ui, sans-serif; text-align: center; transition: opacity .35s ease; }
      .splash.is-gone { opacity: 0; pointer-events: none; }
      .splash__wisp { filter: drop-shadow(0 6px 14px rgba(92, 200, 240, .35)); animation: splash-float 2.6s ease-in-out infinite; }
      .splash__flame { transform-box: fill-box; transform-origin: 50% 100%; animation: splash-flicker 1.7s ease-in-out infinite; }
      .splash__eyes ellipse { transform-box: fill-box; transform-origin: 50% 50%; animation: splash-blink 4s steps(1, end) infinite; }
      .splash__title { margin: 0; font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-size: 26px; font-weight: 700; }
      .splash__bar { width: min(240px, 70vw); height: 8px; border-radius: 999px; background: rgba(52, 36, 26, .12); overflow: hidden; }
      .splash__bar span { display: block; width: var(--splash-p, 12%); height: 100%; border-radius: inherit; background: linear-gradient(90deg, #5cc8f0, #bff0ff); transition: width .3s ease-out; }
      .splash__steps { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; width: min(260px, 80vw); }
      .splash__steps li { display: flex; justify-content: space-between; gap: 12px; color: #85705f; font-size: 13px; font-weight: 700; }
      .splash__steps li.is-done { color: #34241a; }
      .splash__steps li.is-done b { color: #3f8a4a; }
      /* Le serveur tarde (is-slow), ou le jeu n'a pas pu démarrer (is-failed) : une ligne, et de quoi réessayer */
      .splash__note, .splash__retry { display: none; }
      .splash__note { margin: 4px 0 0; max-width: 260px; color: #85705f; font-size: 13px; font-weight: 700; }
      .splash.is-slow:not(.is-failed) .splash__note--slow, .splash.is-failed .splash__note--failed { display: block; }
      .splash.is-failed .splash__retry { display: inline-block; margin-top: 4px; padding: 10px 22px; border: 0; border-radius: 999px; background: #34241a; color: #fffcf5; font: 700 15px 'Nunito', ui-rounded, system-ui, sans-serif; cursor: pointer; }
      .splash__retry:focus-visible { outline: 3px solid #5cc8f0; outline-offset: 2px; }
      @keyframes splash-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes splash-flicker { 0%, 100% { transform: skewX(0deg) scaleY(1); } 30% { transform: skewX(-6deg) scaleY(1.05); } 60% { transform: skewX(5deg) scaleY(.97); } }
      @keyframes splash-blink { 0%, 96% { transform: scaleY(1); } 97% { transform: scaleY(.2); } }
      @media (prefers-color-scheme: dark) {
        .splash { background: radial-gradient(circle at 50% 38%, #4a3324, #2c1f16 62%, #221812); color: #f6e6b8; }
        .splash__bar { background: rgba(251, 235, 192, .16); }
        .splash__steps li { color: rgba(251, 235, 192, .62); }
        .splash__steps li.is-done { color: #f6e6b8; }
        .splash__note { color: rgba(251, 235, 192, .62); }
        .splash.is-failed .splash__retry { background: #f6e6b8; color: #2c1f16; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash__wisp, .splash__flame, .splash__eyes ellipse { animation: none; }
        .splash, .splash__bar span { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" role="status" aria-live="polite" aria-label="Brumelune se prépare">
      <svg class="splash__wisp" width="64" height="80" viewBox="-14 -26 28 35" aria-hidden="true">
        <defs>
          <radialGradient id="splash-body" gradientUnits="userSpaceOnUse" cx="0" cy="-2.4" r="17.6" fx="0" fy="1.6"><stop offset="0" stop-color="#FFFFFF" /><stop offset=".45" stop-color="#BFF0FF" /><stop offset="1" stop-color="#5CC8F0" /></radialGradient>
          <radialGradient id="splash-halo"><stop offset="0" stop-color="rgba(120,210,255,.45)" /><stop offset="1" stop-color="rgba(120,210,255,0)" /></radialGradient>
        </defs>
        <circle cx="0" cy="-5" r="13.5" fill="url(#splash-halo)" />
        <g class="splash__flame"><path d="M0,8 C10.4,8 9.2,-3.6 0,-16.4 C-9.2,-3.6 -10.4,8 0,8 Z" fill="url(#splash-body)" /><path d="M0,8.4 C5.7,8.4 5.1,2 0,-4.4 C-5.1,2 -5.7,8.4 0,8.4 Z" fill="rgba(255,255,255,.75)" /></g>
        <g class="splash__eyes" fill="#1D3557"><ellipse cx="-2.9" cy="-0.8" rx="1.25" ry="1.75" /><ellipse cx="2.9" cy="-0.8" rx="1.25" ry="1.75" /></g>
      </svg>
      <p class="splash__title">Brumelune</p>
      <div class="splash__bar" aria-hidden="true"><span></span></div>
      <ul class="splash__steps">
        <li data-step="code"><span>Le Grimoire s’éveille</span><b>…</b></li>
        <li data-step="fonts"><span>L’encre sèche</span><b>…</b></li>
        <li data-step="carnet"><span>Ta partie revient</span><b>…</b></li>
      </ul>
      <p class="splash__note splash__note--slow">Le serveur se réveille… ça peut prendre une minute.</p>
      <p class="splash__note splash__note--failed">Le jeu n’arrive pas à démarrer (connexion ou serveur).</p>
      <button id="splash-retry" type="button" class="splash__retry">Réessayer</button>
    </div>
    <script>
      // Le code du jeu n'est pas arrivé au bout de 30 s (connexion coupée, fichier introuvable) : l'écran propose de
      // recharger la page plutôt que de rester figé (la partie qui ne revient pas : src/utils/splash.js)
      (function () {
        var splash = document.getElementById('splash');
        document.getElementById('splash-retry').addEventListener('click', function () { location.reload(); });
        setTimeout(function () {
          if (splash.isConnected && !splash.querySelector('[data-step="code"].is-done')) splash.classList.add('is-failed');
        }, 30000);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
