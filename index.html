<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ede0c4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221812" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Brumelune : combine les éléments et fais naître un monde." />
    <title>Brumelune</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Brumelune" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/img/splash/fond-fixe.svg" as="image" type="image/svg+xml" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..600&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <!-- L'écran de démarrage (#splash, src/utils/splash.js) : visible dès les premiers octets, avant le code du jeu. Le
         seul écran de chargement du jeu : pour un compte, il attend aussi l'île (pastille « ile »). -->
    <style>
      /* Mise en page : plein écran, en trois calques. Le fond (l'île, Anya, la mer : public/img/splash/fond.svg) couvre
         tout l'écran, recadré au centre ; l'affiche (Brume qui jaillit du Grimoire, les sept maîtres autour : public/img/splash/affiche.svg) se pose en bas, au milieu ;
         par-dessus, le titre en haut, le chargement et « Entrée » en bas. Les dessins s'animent d'eux-mêmes (SMIL). */
      .splash { --brand-h: clamp(54px, 11vh, 120px); --pad: max(12px, env(safe-area-inset-top), env(safe-area-inset-bottom)); }
      @supports (height: 1dvh) { .splash { --brand-h: clamp(54px, 11dvh, 120px); } }
      .splash { position: fixed; inset: 0; z-index: 10000; overflow: hidden; background: #071430; color: #fff7dc; font-family: 'Nunito', ui-rounded, system-ui, sans-serif; text-align: center; transition: opacity .8s cubic-bezier(.4, 0, .2, 1); }
      .splash.is-gone { opacity: 0; pointer-events: none; }
      /* Le fond est immobile (un SVG animé en plein écran se redessinerait à chaque image) : il dérive lentement, en transformation
         seule, que le navigateur compose sans le redessiner */
      .splash__fond { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; will-change: transform; animation: splash-fond-in 1.6s cubic-bezier(.2, .7, .2, 1) both, splash-derive 24s ease-in-out 1.6s infinite alternate; transition: transform 1.1s cubic-bezier(.3, .8, .3, 1), filter 1.1s ease; }
      .splash__affiche { position: absolute; z-index: 1; left: 50%; bottom: 0; width: min(118vw, 900px, 82vh); aspect-ratio: 900 / 1000; transform: translateX(-50%); animation: splash-affiche-in 1s cubic-bezier(.2, .9, .3, 1.1) .25s both; pointer-events: none; transition: transform 1.1s cubic-bezier(.3, .8, .3, 1), filter 1.1s ease; }
      @supports (height: 1dvh) { .splash__affiche { width: min(118vw, 900px, 82dvh); } }
      /* l'affiche immobile, et Brume par-dessus dans son cadre (splash.js, BRUME : 150 90 600 690 dans 900 × 1000) */
      .splash__affiche-art { position: absolute; inset: 0; width: 100%; height: 100%; }
      .splash__brume { position: absolute; left: 16.667%; top: 9%; width: 66.667%; height: 69%; will-change: transform; animation: splash-brume 4.2s ease-in-out infinite; }
      .splash.is-gone .splash__fond { animation: none; transform: scale(1.06); filter: blur(6px); }
      .splash.is-gone .splash__affiche { transform: translateX(-50%) translateY(4%) scale(1.04); filter: blur(4px); }
      .splash__card { position: relative; z-index: 2; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: var(--pad) max(12px, env(safe-area-inset-right)) var(--pad) max(12px, env(safe-area-inset-left)); transition: transform 1.1s cubic-bezier(.3, .8, .3, 1), filter 1.1s ease; }
      .splash.is-gone .splash__card { transform: scale(1.04); filter: blur(5px); }
      .splash__top, .splash__bottom { display: grid; justify-items: center; gap: 8px; width: 100%; }
      .splash__top { gap: 0; animation: splash-top-in 1.1s cubic-bezier(.2, .8, .3, 1) both; }
      .splash__brand { position: relative; width: min(92vw, 620px, calc(var(--brand-h) * 4.086)); aspect-ratio: 760 / 186; pointer-events: none; filter: drop-shadow(0 6px 10px rgba(0, 8, 26, .8)); }
      .splash__logo { display: block; width: 100%; height: 100%; overflow: visible; }
      .splash__logo-title { fill: url(#splash-logo-gold); stroke: #5b3d23; stroke-width: 2.4px; paint-order: stroke fill; font: 800 72px 'Fraunces', 'Iowan Old Style', Georgia, serif; letter-spacing: .035em; }
      .splash__logo-kicker { fill: #c7edf2; font: 900 11px 'Nunito', ui-rounded, system-ui, sans-serif; letter-spacing: .34em; }
      .splash__logo-flourish { fill: none; stroke: #f4d88d; stroke-linecap: round; opacity: .75; }
      .splash__subtitle { margin: 0; color: rgba(255, 247, 220, .86); font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-size: clamp(12px, 1.8vw, 16px); font-style: italic; margin-top: 2px; line-height: 1.2; letter-spacing: .01em; text-shadow: 0 3px 12px rgba(0, 8, 26, .86); }
      .splash__progress { width: min(520px, 92vw); display: grid; gap: 8px; }
      .splash__bar { height: 10px; padding: 2px; border: 1px solid rgba(201, 241, 255, .22); border-radius: 999px; background: rgba(4, 16, 40, .52); box-shadow: inset 0 2px 6px rgba(0, 0, 0, .32), 0 0 20px rgba(92, 200, 240, .12); overflow: hidden; }
      .splash__bar span { position: relative; display: block; width: var(--splash-p, 12%); height: 100%; border-radius: inherit; background: linear-gradient(90deg, #50bde8, #bff5ff 55%, #fbe39c); box-shadow: 0 0 14px rgba(126, 225, 255, .7); transition: width .35s ease-out; overflow: hidden; }
      .splash__bar span::after { content: ''; position: absolute; inset: 0; width: 42%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); animation: splash-shine 1.8s linear infinite; }
      .splash__steps { margin: 0; padding: 0; list-style: none; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; width: 100%; }
      .splash__steps li[hidden] { display: none; }
      .splash__steps li { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; padding: 5px 8px; border: 1px solid rgba(210, 240, 246, .12); border-radius: 999px; background: rgba(6, 21, 47, .38); color: rgba(225, 239, 242, .56); font-size: clamp(10px, 1.6vw, 12px); font-weight: 800; line-height: 1.15; transition: color .2s, border-color .2s, background .2s; }
      .splash__steps li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .splash__steps li.is-done { border-color: rgba(131, 223, 193, .3); background: rgba(42, 105, 86, .3); color: #ecfff8; }
      .splash__steps li b { flex: 0 0 auto; color: #7d9caf; }
      .splash__steps li.is-done b { color: #8be4bd; }
      /* « Entrée » : cachée pendant le chargement, elle paraît quand tout est prêt, et c'est elle qui ouvre le jeu */
      .splash__enter { display: none; position: relative; z-index: 4; min-width: min(280px, 74vw); padding: 15px 44px 16px;
        border: 0; border-radius: 999px; background: linear-gradient(180deg, #fffbe7, #f5dc98 48%, #d8a34f); color: #4a2e0c;
        box-shadow: 0 6px 0 rgba(90, 58, 18, .55), 0 14px 30px rgba(0, 8, 26, .5), inset 0 0 0 1px rgba(255, 246, 200, .4);
        font: 900 19px 'Nunito', ui-rounded, system-ui, sans-serif; letter-spacing: .18em; cursor: pointer; touch-action: manipulation; }
      .splash__enter::after { content: '→'; display: inline-block; margin-left: 12px; font-weight: 900; animation: splash-enter-arrow 1.6s ease-in-out infinite; }
      .splash__enter:hover, .splash__enter:focus-visible { filter: brightness(1.05); }
      .splash__enter:focus-visible { outline: 3px solid #5cc8f0; outline-offset: 4px; }
      .splash__enter:active { transform: translateY(2px); box-shadow: 0 4px 0 rgba(90, 58, 18, .55), 0 10px 22px rgba(0, 8, 26, .5), inset 0 0 0 1px rgba(255, 246, 200, .4); }
      .splash.is-ready .splash__enter { display: inline-block; animation: splash-enter-in .55s cubic-bezier(.2, .9, .3, 1.2) both, splash-enter-glow 2.6s ease-in-out .7s infinite; }
      .splash.is-ready .splash__progress { height: 0; opacity: 0; overflow: hidden; transform: translateY(-8px); transition: opacity .4s ease, transform .4s ease, height .4s ease; }
      .splash.is-ready .splash__subtitle { opacity: .6; transition: opacity .4s ease; }
      @keyframes splash-enter-in { from { opacity: 0; transform: translateY(16px) scale(.86); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes splash-enter-arrow { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
      @keyframes splash-enter-glow { 0%, 100% { box-shadow: 0 6px 0 rgba(90, 58, 18, .55), 0 14px 30px rgba(0, 8, 26, .5), 0 0 0 0 rgba(255, 214, 120, .6); } 50% { box-shadow: 0 6px 0 rgba(90, 58, 18, .55), 0 14px 30px rgba(0, 8, 26, .5), 0 0 0 10px rgba(255, 214, 120, 0); } }
      /* Le rideau du fondu au noir (sous l'écran de démarrage) : il paraît vite, tient le noir un instant, puis s'efface
         lentement pour révéler la scène */
      #splash-curtain { position: fixed; inset: 0; z-index: 9990; background: #04060d; opacity: 0; pointer-events: none; transition: opacity .45s ease; }
      #splash-curtain.is-on { opacity: 1; }
      #splash-curtain.is-out { transition: opacity .9s cubic-bezier(.4, 0, .2, 1); opacity: 0; }
      /* Le serveur tarde (is-slow), ou le jeu n'a pas pu démarrer (is-failed) : une ligne, et de quoi réessayer */
      .splash__note, .splash__retry { display: none; }
      .splash__note { margin: 0; max-width: 420px; color: rgba(225, 239, 242, .72); font-size: 13px; font-weight: 800; }
      .splash.is-slow:not(.is-failed) .splash__note--slow, .splash.is-failed .splash__note--failed { display: block; }
      .splash.is-failed .splash__retry { display: inline-block; margin-top: 2px; padding: 11px 24px; border: 1px solid rgba(255,255,255,.36); border-radius: 999px; background: #fff0c4; color: #13233f; box-shadow: 0 8px 22px rgba(0,0,0,.24); font: 900 14px 'Nunito', ui-rounded, system-ui, sans-serif; cursor: pointer; }
      .splash__retry:focus-visible { outline: 3px solid #5cc8f0; outline-offset: 2px; }
      @keyframes splash-fond-in { from { opacity: 0; transform: scale(1.05); } }
      @keyframes splash-derive { from { transform: scale(1) translate3d(0, 0, 0); } to { transform: scale(1.04) translate3d(-1%, -.6%, 0); } }
      @keyframes splash-brume { 0%, 100% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(0, -1.6%, 0); } }
      @keyframes splash-affiche-in { from { opacity: 0; transform: translateX(-50%) translateY(10%); } }
      @keyframes splash-top-in { from { opacity: 0; transform: translateY(-12px); } }
      @keyframes splash-shine { from { transform: translateX(-130%); } to { transform: translateX(310%); } }
      /* Écran bas (téléphone en paysage) : sans le sous-titre, l'affiche garde la place */
      @media (max-height: 560px) { .splash__subtitle { display: none; } .splash__bottom { gap: 6px; } .splash__affiche { width: min(118vw, 72vh); } }
      /* Écran étroit : les étapes passent sur deux lignes plutôt que d'être coupées */
      @media (max-width: 420px) { .splash__steps { gap: 4px; } .splash__steps li { padding: 4px 6px; gap: 4px; } .splash__steps li span { white-space: normal; } }
      @media (prefers-reduced-motion: reduce) {
        .splash__fond, .splash__affiche, .splash__brume, .splash__top, .splash__bar span::after { animation: none; }
        .splash, .splash__fond, .splash__affiche, .splash__card, .splash__bar span { transition: none; }
        .splash__enter, .splash__enter::after, .splash.is-ready .splash__enter { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" role="status" aria-live="polite" aria-label="Brumelune se prépare">
      <img id="splash-fond" class="splash__fond" src="/img/splash/fond-fixe.svg" alt="L’île de Brumelune sous la lune, ses maisons et Anya sur la colline" />
      <div class="splash__affiche">
        <img class="splash__affiche-art" src="/img/splash/affiche.svg" alt="Le Grimoire ouvert, entouré des sept maîtres" />
        <img id="splash-brume" class="splash__brume" src="/img/splash/brume.svg" alt="Brume jaillit du Grimoire" />
      </div>
      <script>
        // Pour qui demande moins de mouvement : Brume immobile
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) document.getElementById('splash-brume').src = '/img/splash/brume-fixe.svg';
      </script>
      <div class="splash__card">
        <div class="splash__top">
          <div class="splash__brand">
            <svg class="splash__logo" viewBox="0 0 760 186" role="img" aria-label="Brumelune">
              <defs>
                <path id="splash-logo-arc" d="M76 142 Q380 -2 684 142" />
                <linearGradient id="splash-logo-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe7"/><stop offset=".48" stop-color="#f5dc98"/><stop offset="1" stop-color="#c8974e"/></linearGradient>
              </defs>
              <text class="splash__logo-title"><textPath href="#splash-logo-arc" startOffset="50%" text-anchor="middle">BRUMELUNE</textPath></text>
              <path class="splash__logo-flourish" d="M205 150q77 17 151 5m199-5q-77 17-151 5" />
              <circle cx="380" cy="152" r="4" fill="#f4d88d"/><circle cx="380" cy="152" r="9" fill="none" stroke="#f4d88d" stroke-opacity=".38"/>
              <text class="splash__logo-kicker" x="380" y="180" text-anchor="middle">L’ÎLE AUX SEPT SOUFFLES</text>
            </svg>
          </div>
          <p class="splash__subtitle">L’île se souvient de tout ce que tu fais naître.</p>
        </div>
        <div class="splash__bottom">
          <div class="splash__progress">
            <div class="splash__bar" aria-hidden="true"><span></span></div>
            <ul class="splash__steps">
              <li data-step="code"><span>Le Grimoire s’éveille</span><b>…</b></li>
              <li data-step="fonts"><span>L’encre sèche</span><b>…</b></li>
              <li data-step="carnet"><span>Ta partie revient</span><b>…</b></li>
              <li data-step="ile" hidden><span>L’île se réveille</span><b>…</b></li>
            </ul>
          </div>
          <button id="splash-enter" type="button" class="splash__enter">Entrée</button>
          <p class="splash__note splash__note--slow">Brume rappelle l’île… le serveur peut prendre une minute.</p>
          <p class="splash__note splash__note--failed">Brumelune ne répond pas encore. Vérifie ta connexion puis réessaie.</p>
          <button id="splash-retry" type="button" class="splash__retry">Réessayer</button>
        </div>
      </div>
    </div>
    <script>
      // Le code du jeu n'est pas arrivé au bout de 30 s (connexion coupée, fichier introuvable) : l'écran propose de
      // recharger la page plutôt que de rester figé (la partie qui ne revient pas : src/utils/splash.js)
      (function () {
        var splash = document.getElementById('splash');
        document.getElementById('splash-retry').addEventListener('click', function () { location.reload(); });
        setTimeout(function () {
          if (splash.isConnected && !splash.querySelector('[data-step="code"].is-done')) splash.classList.add('is-failed');
        }, 30000);
      })();
    </script>
    <!-- Le rideau du fondu au noir : sous l'écran de démarrage, au-dessus du jeu. Il paraît quand on touche « Entrée »
         (le temps que l'écran se dissolve), puis s'efface lentement pour révéler la scène. -->
    <div id="splash-curtain" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
