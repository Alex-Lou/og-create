<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ede0c4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221812" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Brumelune : combine les éléments et fais naître un monde." />
    <title>Brumelune</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Brumelune" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/img/brumelune-splash.svg" as="image" type="image/svg+xml" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..600&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <!-- L'écran de démarrage (#splash, src/utils/splash.js) : visible dès les premiers octets, avant le code du jeu -->
    <style>
      .splash { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; overflow: hidden; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: radial-gradient(circle at 50% 24%, #314c78 0, #172849 38%, #09162e 100%); color: #fff7dc; font-family: 'Nunito', ui-rounded, system-ui, sans-serif; text-align: center; transition: opacity .45s ease, filter .45s ease; }
      .splash::before, .splash::after { content: ''; position: absolute; inset: auto -12% -12%; height: 42%; border-radius: 50%; background: rgba(213, 240, 235, .1); filter: blur(30px); animation: splash-mist 9s ease-in-out infinite alternate; pointer-events: none; }
      .splash::after { inset: 0 -20% auto; height: 24%; opacity: .5; animation-direction: alternate-reverse; }
      .splash.is-gone { opacity: 0; pointer-events: none; }
      .splash__card { position: relative; width: min(860px, 96vw); max-height: 96dvh; display: grid; justify-items: center; gap: clamp(7px, 1.3vh, 13px); }
      .splash__scene { position: relative; width: min(760px, 92vw); max-height: min(59dvh, 590px); aspect-ratio: 9 / 7; filter: drop-shadow(0 24px 36px rgba(0, 8, 26, .42)); }
      .splash__art { display: block; width: 100%; height: 100%; object-fit: contain; }
      .splash__brand { display: grid; gap: 0; margin-top: clamp(-20px, -2vh, -8px); text-shadow: 0 3px 14px rgba(0, 14, 42, .8); }
      .splash__eyebrow { color: #b9eafb; font-size: clamp(10px, 1.5vw, 13px); font-weight: 900; letter-spacing: .23em; text-transform: uppercase; }
      .splash__title { margin: 0; font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-size: clamp(34px, 7vw, 66px); font-weight: 760; line-height: .95; letter-spacing: .015em; }
      .splash__subtitle { margin: 4px 0 0; color: rgba(255, 247, 220, .76); font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-size: clamp(12px, 2vw, 16px); font-style: italic; }
      .splash__progress { width: min(520px, 82vw); display: grid; gap: 8px; }
      .splash__bar { height: 10px; padding: 2px; border: 1px solid rgba(201, 241, 255, .22); border-radius: 999px; background: rgba(4, 16, 40, .52); box-shadow: inset 0 2px 6px rgba(0, 0, 0, .32), 0 0 20px rgba(92, 200, 240, .12); overflow: hidden; }
      .splash__bar span { position: relative; display: block; width: var(--splash-p, 12%); height: 100%; border-radius: inherit; background: linear-gradient(90deg, #50bde8, #bff5ff 55%, #fbe39c); box-shadow: 0 0 14px rgba(126, 225, 255, .7); transition: width .35s ease-out; overflow: hidden; }
      .splash__bar span::after { content: ''; position: absolute; inset: 0; width: 42%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); animation: splash-shine 1.8s linear infinite; }
      .splash__steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; width: 100%; }
      .splash__steps li { display: flex; align-items: center; justify-content: center; gap: 7px; min-width: 0; padding: 5px 8px; border: 1px solid rgba(210, 240, 246, .12); border-radius: 999px; background: rgba(6, 21, 47, .38); color: rgba(225, 239, 242, .56); font-size: clamp(10px, 1.6vw, 12px); font-weight: 800; transition: color .2s, border-color .2s, background .2s; }
      .splash__steps li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .splash__steps li.is-done { border-color: rgba(131, 223, 193, .3); background: rgba(42, 105, 86, .3); color: #ecfff8; }
      .splash__steps li b { color: #7d9caf; }
      .splash__steps li.is-done b { color: #8be4bd; }
      /* Le serveur tarde (is-slow), ou le jeu n'a pas pu démarrer (is-failed) : une ligne, et de quoi réessayer */
      .splash__note, .splash__retry { display: none; }
      .splash__note { margin: 0; max-width: 420px; color: rgba(225, 239, 242, .72); font-size: 13px; font-weight: 800; }
      .splash.is-slow:not(.is-failed) .splash__note--slow, .splash.is-failed .splash__note--failed { display: block; }
      .splash.is-failed .splash__retry { display: inline-block; margin-top: 2px; padding: 11px 24px; border: 1px solid rgba(255,255,255,.36); border-radius: 999px; background: #fff0c4; color: #13233f; box-shadow: 0 8px 22px rgba(0,0,0,.24); font: 900 14px 'Nunito', ui-rounded, system-ui, sans-serif; cursor: pointer; }
      .splash__retry:focus-visible { outline: 3px solid #5cc8f0; outline-offset: 2px; }
      @keyframes splash-mist { from { transform: translateX(-5%); } to { transform: translateX(5%); } }
      @keyframes splash-shine { from { transform: translateX(-130%); } to { transform: translateX(310%); } }
      @media (max-height: 680px) { .splash__scene { max-height: 50dvh; } .splash__subtitle { display: none; } }
      @media (max-width: 520px) { .splash__card { gap: 7px; } .splash__scene { width: min(106vw, 620px); max-height: 54dvh; } .splash__steps { gap: 4px; } .splash__steps li { padding-inline: 5px; } }
      @media (prefers-reduced-motion: reduce) {
        .splash::before, .splash::after, .splash__bar span::after { animation: none; }
        .splash, .splash__bar span { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" role="status" aria-live="polite" aria-label="Brumelune se prépare">
      <div class="splash__card">
        <div class="splash__scene"><img class="splash__art" src="/img/brumelune-splash.svg" alt="L’île de Brumelune et ses naufragés réunis autour du feu" /></div>
        <div class="splash__brand">
          <span class="splash__eyebrow">Bienvenue sur l’île</span>
          <p class="splash__title">Brumelune</p>
          <p class="splash__subtitle">Un monde renaît de ce que tu écris.</p>
        </div>
        <div class="splash__progress">
          <div class="splash__bar" aria-hidden="true"><span></span></div>
          <ul class="splash__steps">
            <li data-step="code"><span>Le Grimoire s’éveille</span><b>…</b></li>
            <li data-step="fonts"><span>L’encre sèche</span><b>…</b></li>
            <li data-step="carnet"><span>Ta partie revient</span><b>…</b></li>
          </ul>
        </div>
        <p class="splash__note splash__note--slow">Brume rappelle l’île… le serveur peut prendre une minute.</p>
        <p class="splash__note splash__note--failed">Brumelune ne répond pas encore. Vérifie ta connexion puis réessaie.</p>
        <button id="splash-retry" type="button" class="splash__retry">Réessayer</button>
      </div>
    </div>
    <script>
      // Le code du jeu n'est pas arrivé au bout de 30 s (connexion coupée, fichier introuvable) : l'écran propose de
      // recharger la page plutôt que de rester figé (la partie qui ne revient pas : src/utils/splash.js)
      (function () {
        var splash = document.getElementById('splash');
        document.getElementById('splash-retry').addEventListener('click', function () { location.reload(); });
        setTimeout(function () {
          if (splash.isConnected && !splash.querySelector('[data-step="code"].is-done')) splash.classList.add('is-failed');
        }, 30000);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
