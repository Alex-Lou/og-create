<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
  <!-- Fond du cadre avec léger gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120b17" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0c0912" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#070610" stop-opacity="0.9" />
    </linearGradient>
    
    <!-- Filtre pour l'effet de lueur -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Motif pour la texture -->
    <pattern id="noisePattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#000000" opacity="0.03" />
      <rect x="30" y="20" width="1" height="1" fill="#4a364a" opacity="0.3" />
      <rect x="70" y="60" width="1" height="1" fill="#4a364a" opacity="0.2" />
      <rect x="40" y="80" width="1" height="1" fill="#4a364a" opacity="0.4" />
      <rect x="60" y="30" width="1" height="1" fill="#4a364a" opacity="0.3" />
    </pattern>
  </defs>
  
  <!-- Rectangle principal avec coin arrondi -->
  <rect x="10" y="10" width="480" height="580" rx="10" ry="10" 
        fill="url(#bgGradient)" 
        stroke="#331d33" 
        stroke-width="2" />
  
  <!-- Texture de bruit subtile -->
  <rect x="10" y="10" width="480" height="580" rx="10" ry="10" 
        fill="url(#noisePattern)" 
        opacity="0.4" />
  
  <!-- Cadre intérieur ornemental -->
  <rect x="20" y="20" width="460" height="560" rx="8" ry="8" 
        fill="none" 
        stroke="#6e4a8e" 
        stroke-width="1" 
        stroke-opacity="0.3" />
  
  <!-- Ornements aux coins -->
  <!-- Coin supérieur gauche -->
  <path d="M10,30 Q10,10 30,10 L60,10 Q50,25 30,25 Q15,25 10,30 Z" 
        fill="#331d33" 
        opacity="0.7" 
        filter="url(#glow)" />
  <path d="M12,28 Q12,12 28,12 L50,12" 
        fill="none" 
        stroke="#8a5cad" 
        stroke-width="1.5" 
        stroke-opacity="0.8" />
  
  <!-- Coin supérieur droit -->
  <path d="M490,30 Q490,10 470,10 L440,10 Q450,25 470,25 Q485,25 490,30 Z" 
        fill="#331d33" 
        opacity="0.7" 
        filter="url(#glow)" />
  <path d="M488,28 Q488,12 472,12 L450,12" 
        fill="none" 
        stroke="#8a5cad" 
        stroke-width="1.5" 
        stroke-opacity="0.8" />
  
  <!-- Coin inférieur gauche -->
  <path d="M10,570 Q10,590 30,590 L60,590 Q50,575 30,575 Q15,575 10,570 Z" 
        fill="#331d33" 
        opacity="0.7" 
        filter="url(#glow)" />
  <path d="M12,572 Q12,588 28,588 L50,588" 
        fill="none" 
        stroke="#8a5cad" 
        stroke-width="1.5" 
        stroke-opacity="0.8" />
  
  <!-- Coin inférieur droit -->
  <path d="M490,570 Q490,590 470,590 L440,590 Q450,575 470,575 Q485,575 490,570 Z" 
        fill="#331d33" 
        opacity="0.7" 
        filter="url(#glow)" />
  <path d="M488,572 Q488,588 472,588 L450,588" 
        fill="none" 
        stroke="#8a5cad" 
        stroke-width="1.5" 
        stroke-opacity="0.8" />
  
  <!-- Runes subtiles -->
  <g opacity="0.4" fill="#8a5cad">
    <text x="30" y="45" font-family="serif" font-size="12">✧</text>
    <text x="460" y="45" font-family="serif" font-size="12">✧</text>
    <text x="30" y="565" font-family="serif" font-size="12">✧</text>
    <text x="460" y="565" font-family="serif" font-size="12">✧</text>
  </g>
  
  <!-- Ligne de séparation pour le titre -->
  <rect x="40" y="70" width="420" height="2" fill="#331d33" opacity="0.5" />
  <rect x="40" y="72" width="420" height="1" fill="#8a5cad" opacity="0.3" />
  
  <!-- Points lumineux subtils -->
  <circle cx="30" cy="70" r="1" fill="#8a5cad" opacity="0.9" filter="url(#glow)" />
  <circle cx="470" cy="70" r="1" fill="#8a5cad" opacity="0.9" filter="url(#glow)" />
</svg>