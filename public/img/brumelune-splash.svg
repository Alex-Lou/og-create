    <path d="M150 354Q212 420 329 452Q462 488 594 451Q697 422 750 358Q690 479 594 546Q469 625 336 548Q230 483 150 354Z" fill="url(#cliff)" stroke="#302a2b" stroke-width="5"/>
    <path d="M220 407q55 36 118 51l23 70-62-88Zm105 53 54 12 18 96-43-32Zm86 17 58 1-17 113-39-23Zm88-2 58-12-36 89-48 25Zm91-21q55-17 97-48l-71 93-71 53Z" fill="#aa8f69" opacity=".2"/>
    <path d="M150 354Q205 257 332 229Q449 202 565 236Q685 271 750 358Q695 410 588 434Q460 463 329 438Q215 417 150 354Z" fill="url(#grass)" stroke="#254d47" stroke-width="6"/>
    <g clip-path="url(#islandTop)"><path d="M175 357Q254 294 359 278Q493 257 616 301Q680 325 724 362" fill="none" stroke="#b8d88a" stroke-opacity=".45" stroke-width="3"/><path d="M201 373Q275 319 370 307Q482 292 588 324Q646 342 696 376" fill="none" stroke="#d4e8a5" stroke-opacity=".35" stroke-width="3"/><path d="M239 386Q309 349 388 342Q474 333 551 352Q602 365 650 391" fill="none" stroke="#eef2b9" stroke-opacity=".3" stroke-width="2.5"/><path d="M323 396Q370 374 423 372Q492 368 555 393" fill="none" stroke="#eef2b9" stroke-opacity=".25" stroke-width="2"/><path d="M292 417Q377 400 462 408T624 410" fill="none" stroke="#203f45" stroke-opacity=".24" stroke-width="2"/><path d="M334 239Q356 284 391 304T453 357M566 238Q552 285 514 311T453 357M237 301Q303 330 365 326M657 304Q597 327 540 324" fill="none" stroke="#e4e8a9" stroke-opacity=".22" stroke-width="2" stroke-dasharray="5 7"/></g>
    <path d="M273 382Q352 343 443 351Q539 352 628 390Q552 432 444 438Q342 433 273 382Z" fill="url(#shore)" stroke="#a47e4f" stroke-width="3"/><path d="M306 385Q371 361 445 365Q523 365 594 390Q530 418 446 422Q366 417 306 385Z" fill="#f2d797" opacity=".78"/>
  </g>
  <g filter="url(#smallShadow)">
    <g transform="translate(306 294)"><path d="M0 36 30 0l30 36Z" fill="#d65844" stroke="#3c2819" stroke-width="4"/><path d="M9 35 30 12l21 23Z" fill="#f5c881" opacity=".55"/><path d="M-5 39h70" stroke="#3c2819" stroke-width="5" stroke-linecap="round"/></g>
    <g transform="translate(618 263)"><path d="M-22 83h44L17 17h-34Z" fill="#f2eee0" stroke="#3c2819" stroke-width="4"/><path d="M-20 62h40l-2-22h-36Z" fill="#d84e45"/><path d="M-12 17V0h24v17" fill="#f2c85b" stroke="#3c2819" stroke-width="4"/><path d="M-18 22h36" stroke="#3c2819" stroke-width="5"/><path d="M6-1 62-22" stroke="#ffe9a1" stroke-opacity=".44" stroke-width="15" stroke-linecap="round"/></g>
    <g fill="#315f49" stroke="#25493c" stroke-width="3"><path d="M224 342q-6-43 29-67 4 32 24 52-23 10-53 15Z"/><path d="M378 292q-7-53 30-86 10 37 37 65-28 16-67 21Z"/><path d="M510 289q1-48 40-74 3 36 25 65-28 11-65 9Z"/><path d="M680 348q0-45 36-72 5 36 27 61-26 11-63 11Z"/></g>
    <g fill="#234b43"><ellipse cx="348" cy="319" rx="36" ry="22"/><ellipse cx="390" cy="316" rx="33" ry="25"/><ellipse cx="498" cy="317" rx="39" ry="24"/><ellipse cx="544" cy="321" rx="31" ry="20"/></g>
  </g>
  <g class="mist mist--back"><ellipse cx="150" cy="354" rx="190" ry="26" fill="url(#mist)"/><ellipse cx="739" cy="352" rx="205" ry="28" fill="url(#mist)"/></g>
  <g class="mist mist--front"><ellipse cx="318" cy="446" rx="240" ry="35" fill="url(#mist)"/><ellipse cx="676" cy="432" rx="218" ry="31" fill="url(#mist)"/></g>
  <g transform="translate(450 422)" filter="url(#smallShadow)"><circle class="fire-glow" r="82" fill="url(#fireGlow)"/><path d="M-35 15 35-8M-34-7l69 23" stroke="#51321f" stroke-width="11" stroke-linecap="round"/><g class="fire"><path d="M0 7c-27 0-31-25-16-47 9-13 13-23 16-39 6 18 18 27 22 43C29-13 20 7 0 7Z" fill="#ef613d" stroke="#783326" stroke-width="3"/><path d="M0 5c-15 0-18-14-9-26 5-8 7-13 9-23 5 10 11 16 13 26C16-5 11 5 0 5Z" fill="#ffd15f"/></g><g class="sparks" fill="#ffd875"><circle cx="-13" cy="-48" r="3"/><circle cx="12" cy="-39" r="2.5"/><circle cx="3" cy="-62" r="2"/></g></g>
  <rect x="8" y="8" width="884" height="634" rx="30" fill="none" stroke="#f9e7ad" stroke-opacity=".22" stroke-width="2"/><rect x="17" y="17" width="866" height="616" rx="24" fill="none" stroke="#78b9ca" stroke-opacity=".16"/>
  <style>
    .waves{animation:waves 7s ease-in-out infinite alternate;transform-origin:450px 450px}.mist{animation:mist 11s ease-in-out infinite alternate}.mist--front{animation-direction:alternate-reverse;animation-duration:14s}.fire{animation:fire 1.35s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.fire-glow{animation:glow 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.sparks circle{animation:spark 2.1s ease-out infinite;transform-box:fill-box;transform-origin:center}.sparks circle:nth-child(2){animation-delay:-.7s}.sparks circle:nth-child(3){animation-delay:-1.3s}
    @keyframes waves{from{transform:translateX(-10px) scaleY(.98)}to{transform:translateX(10px) scaleY(1.02)}}@keyframes mist{from{transform:translateX(-34px);opacity:.62}to{transform:translateX(34px);opacity:.95}}@keyframes fire{0%,100%{transform:skewX(-2deg) scaleY(1)}45%{transform:skewX(5deg) scaleY(1.08)}72%{transform:skewX(-5deg) scaleY(.94)}}@keyframes glow{0%,100%{transform:scale(.94);opacity:.75}50%{transform:scale(1.08);opacity:1}}@keyframes spark{0%{transform:translateY(8px) scale(.5);opacity:0}24%{opacity:1}100%{transform:translateY(-27px) translateX(7px) scale(.1);opacity:0}}
    @media(prefers-reduced-motion:reduce){.waves,.mist,.fire,.fire-glow,.sparks circle{animation:none}}
  </style>
</svg>
