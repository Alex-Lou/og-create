  <g class="waves" fill="none" stroke-linecap="round"><path d="M-60 371Q58 337 178 374t231-3 226 0 325 2" stroke="#d8f1ee" stroke-opacity=".31" stroke-width="8"/><path d="M-30 443Q77 411 195 443t237-4 234 5 286-8" stroke="#86c9d8" stroke-opacity=".26" stroke-width="5"/><path d="M-40 532Q94 491 211 524t250-2 238 3 253-9" stroke="#b9e2e8" stroke-opacity=".15" stroke-width="7"/><path d="M52 594q117-25 223 1m340-3q105-23 208-1" stroke="#72b8cb" stroke-opacity=".18" stroke-width="4"/></g>
  <ellipse cx="450" cy="423" rx="342" ry="86" fill="#05142b" opacity=".5"/>
  <g filter="url(#islandShadow)">
    <path d="M132 365q69 78 187 108 136 39 271 0 110-32 178-105-72 132-176 201-132 86-275 2-113-69-185-206Z" fill="url(#cliff)" stroke="#292730" stroke-width="5"/>
    <path d="M203 419q59 42 126 58l27 73-67-58Zm111 60 58 13 17 98-43-35Zm91 18 61 2-18 115-41-23Zm93-1 62-14-40 93-50 25Zm96-24q60-19 105-58l-77 106-76 57Z" fill="url(#cliffShade)"/>
    <path d="M132 365Q207 261 335 235Q458 207 577 242Q700 276 768 368Q700 426 585 450Q449 479 316 447Q205 422 132 365Z" fill="url(#grass)" stroke="#234e49" stroke-width="6"/>
    <g clip-path="url(#islandTop)"><path d="M145 359q101-77 224-84 148-9 274 56 65 33 110 57" fill="none" stroke="#cbe49b" stroke-opacity=".47" stroke-width="4"/><path d="M173 387q87-63 194-72 130-11 251 38 67 27 111 61" fill="none" stroke="#e3efae" stroke-opacity=".32" stroke-width="3"/><path d="M223 409q76-42 163-50 112-10 211 29 55 21 94 49" fill="none" stroke="#f1f5bc" stroke-opacity=".25" stroke-width="2.5"/><path d="M300 433q77-25 155-22 101 3 189 32" fill="none" stroke="#173b42" stroke-opacity=".25" stroke-width="3"/><path d="M341 239q19 54 57 79t53 47m127-125q-15 55-53 80t-74 45M230 310q69 35 137 30m307-27q-64 34-126 28" fill="none" stroke="#eff2ad" stroke-opacity=".2" stroke-width="2" stroke-dasharray="6 8"/><path d="M126 365q78 23 150 13t144 6 155-2 190-11" fill="none" stroke="url(#grassShade)" stroke-width="28" opacity=".45"/></g>
    <path d="M262 397q85-42 184-34 102 0 195 42-81 48-196 53-109-6-183-61Z" fill="url(#shore)" stroke="#9d7548" stroke-width="3"/><path d="M298 400q70-25 149-22 83 0 158 28-68 31-158 35-85-5-149-41Z" fill="#f6dda0" opacity=".8"/>
  </g>
  <g filter="url(#smallShadow)">
    <g transform="translate(278 293)"><path d="M0 42 34 0l34 42Z" fill="#d95443" stroke="#3c2819" stroke-width="4"/><path d="m11 40 23-27 24 27Z" fill="#f4cb83" opacity=".62"/><path d="M-6 45h80" stroke="#3c2819" stroke-width="5" stroke-linecap="round"/></g>
    <g class="lighthouse" transform="translate(648 249)"><path d="M-24 96h48l-5-69h-38Z" fill="url(#lighthouse)" stroke="#3c2819" stroke-width="4"/><path d="M-21 74h42l-2-24h-38Z" fill="#d95046"/><path d="M-14 27V8h28v19" fill="#f1cb62" stroke="#3c2819" stroke-width="4"/><path d="M-21 32h42" stroke="#3c2819" stroke-width="5"/><path d="M0 14 112-32 8 29Z" fill="url(#beam)" class="lighthouse__beam"/><circle cy="18" r="10" fill="#ffeaa3" opacity=".28"/></g>
    <g fill="#315e49" stroke="#24473c" stroke-width="3"><path d="M204 354q-5-48 34-75 4 36 26 58-26 12-60 17Z"/><path d="M372 299q-7-57 34-93 11 41 40 70-31 17-74 23Z"/><path d="M518 296q0-52 43-81 4 39 28 71-31 12-71 10Z"/><path d="M701 358q0-49 39-78 5 39 30 67-29 12-69 11Z"/></g><g fill="#214940"><ellipse cx="339" cy="330" rx="39" ry="23"/><ellipse cx="387" cy="326" rx="37" ry="27"/><ellipse cx="503" cy="328" rx="42" ry="26"/><ellipse cx="554" cy="333" rx="34" ry="21"/></g>
