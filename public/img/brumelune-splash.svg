<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Brumelune s’éveille</title>
  <desc id="desc">Une île nocturne surgit de la brume. Le phare balaie la mer tandis qu’un feu veille au creux des falaises.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071126"/><stop offset=".48" stop-color="#142d4d"/><stop offset="1" stop-color="#345f70"/></linearGradient>
    <radialGradient id="skyLight" cx="50%" cy="20%" r="65%"><stop stop-color="#6d91a6" stop-opacity=".34"/><stop offset=".48" stop-color="#2b5372" stop-opacity=".12"/><stop offset="1" stop-color="#071126" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon" cx="36%" cy="28%" r="72%"><stop stop-color="#fffdf1"/><stop offset=".5" stop-color="#f8e7a7"/><stop offset="1" stop-color="#d9aa54"/></radialGradient>
    <radialGradient id="moonHalo"><stop stop-color="#fff2b3" stop-opacity=".42"/><stop offset=".55" stop-color="#dcecff" stop-opacity=".13"/><stop offset="1" stop-color="#b9e8f0" stop-opacity="0"/></radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#35677b"/><stop offset=".38" stop-color="#204963"/><stop offset="1" stop-color="#071d38"/></linearGradient>
    <linearGradient id="seaGlow"><stop stop-color="#bfe9e9" stop-opacity="0"/><stop offset=".5" stop-color="#eaf8dc" stop-opacity=".28"/><stop offset="1" stop-color="#bfe9e9" stop-opacity="0"/></linearGradient>
    <linearGradient id="cliff" x1=".15" y1="0" x2=".8" y2="1"><stop stop-color="#987b5d"/><stop offset=".46" stop-color="#5f4c42"/><stop offset="1" stop-color="#292934"/></linearGradient>
    <linearGradient id="cliffShade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d2b17b" stop-opacity=".32"/><stop offset="1" stop-color="#172339" stop-opacity=".08"/></linearGradient>
    <linearGradient id="grass" x1=".12" y1="0" x2=".85" y2="1"><stop stop-color="#9bc372"/><stop offset=".4" stop-color="#629a61"/><stop offset="1" stop-color="#28554f"/></linearGradient>
    <linearGradient id="grassShade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8e99f" stop-opacity=".38"/><stop offset="1" stop-color="#193f42" stop-opacity=".18"/></linearGradient>
    <linearGradient id="shore" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8dfa0"/><stop offset="1" stop-color="#bd8b52"/></linearGradient>
    <linearGradient id="mist"><stop stop-color="#c8edf2" stop-opacity="0"/><stop offset=".27" stop-color="#e6fbf5" stop-opacity=".58"/><stop offset=".7" stop-color="#c9edf3" stop-opacity=".31"/><stop offset="1" stop-color="#b7dfe9" stop-opacity="0"/></linearGradient>
    <radialGradient id="fireGlow"><stop stop-color="#ffd97e" stop-opacity=".74"/><stop offset=".44" stop-color="#f49a48" stop-opacity=".24"/><stop offset="1" stop-color="#ef7a35" stop-opacity="0"/></radialGradient>
    <linearGradient id="fireOuter" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe272"/><stop offset=".5" stop-color="#f4813f"/><stop offset="1" stop-color="#d44734"/></linearGradient>
    <linearGradient id="lighthouse"><stop stop-color="#fffdf2"/><stop offset=".58" stop-color="#e8e5d8"/><stop offset="1" stop-color="#b8c2c6"/></linearGradient>
    <linearGradient id="beam"><stop stop-color="#fff2a8" stop-opacity=".55"/><stop offset="1" stop-color="#fff2a8" stop-opacity="0"/></linearGradient>
    <filter id="islandShadow" x="-20%" y="-20%" width="140%" height="165%"><feDropShadow dx="0" dy="18" stdDeviation="13" flood-color="#020817" flood-opacity=".62"/></filter>
    <filter id="smallShadow" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#020817" flood-opacity=".58"/></filter>
    <clipPath id="islandTop"><path d="M132 365Q207 261 335 235Q458 207 577 242Q700 276 768 368Q700 426 585 450Q449 479 316 447Q205 422 132 365Z"/></clipPath>
  </defs>
