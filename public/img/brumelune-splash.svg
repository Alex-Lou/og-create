  <g class="constellations" fill="none" stroke="#dff8ff" stroke-linecap="round"><path d="M96 155 129 177l38-13 29 25"/><path d="M701 99l26 29 34-8 25 28"/><g stroke-width="2"><path d="M126 170h12m-6-6v12"/><path d="M735 112h12m-6-6v12"/><path d="M808 247h10m-5-5v10"/></g></g>
