<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">L’île de Brumelune et ses naufragés</title>
  <desc id="desc">Brumelune flotte au-dessus d’une mer nocturne. Brume veille sur Aster, Cannelle et Rivet réunis autour du feu.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101b42"/>
      <stop offset=".52" stop-color="#273b67"/>
      <stop offset="1" stop-color="#d48270"/>
    </linearGradient>
    <radialGradient id="moon" cx="45%" cy="42%" r="58%">
      <stop offset="0" stop-color="#fffdf1"/>
      <stop offset=".72" stop-color="#f8e8b9"/>
      <stop offset="1" stop-color="#e7c87f"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#213f67"/>
      <stop offset="1" stop-color="#0b203d"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79a965"/>
      <stop offset="1" stop-color="#35674e"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a55"/>
      <stop offset="1" stop-color="#3d3440"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d99c"/>
      <stop offset="1" stop-color="#cfa870"/>
    </linearGradient>
    <radialGradient id="brumeBody" cx="46%" cy="36%" r="68%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".42" stop-color="#c9f4ff"/>
      <stop offset="1" stop-color="#55c8f2"/>
    </radialGradient>
    <radialGradient id="fireGlow">
      <stop offset="0" stop-color="#ffd65a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#08142d" flood-opacity=".42"/>
    </filter>
    <filter id="characterShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1a1730" flood-opacity=".38"/>
    </filter>
    <clipPath id="frame"><rect x="10" y="10" width="880" height="680" rx="42"/></clipPath>
  </defs>
  <style>
    .island { transform-origin: 450px 365px; animation: island-drift 6s ease-in-out infinite; }
    .mist-a { animation: mist-a 11s ease-in-out infinite alternate; }
    .mist-b { animation: mist-b 14s ease-in-out infinite alternate; }
    .wave-a { animation: wave 5s ease-in-out infinite alternate; }
    .wave-b { animation: wave 7s ease-in-out -2s infinite alternate-reverse; }
    .star { animation: twinkle 3.4s ease-in-out infinite; }
    .star:nth-child(3n) { animation-delay: -1.1s; }
    .star:nth-child(4n) { animation-delay: -2.4s; }
    .brume { transform-origin: 450px 430px; animation: brume-float 2.7s ease-in-out infinite; }
    .brume-flame { transform-origin: 450px 437px; animation: flame 1.8s ease-in-out infinite; }
    .chibi { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
    .chibi.cannelle { animation-delay: -.8s; }
    .chibi.rivet { animation-delay: -1.7s; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.8s steps(1, end) infinite; }
    .cannelle .blink { animation-delay: -1.4s; }
    .rivet .blink { animation-delay: -2.8s; }
    .fire { transform-origin: 450px 594px; animation: fire 1.15s ease-in-out infinite alternate; }
    .spark { animation: spark 2.4s ease-out infinite; }
    .spark.s2 { animation-delay: -.9s; }
    .spark.s3 { animation-delay: -1.7s; }
    @keyframes island-drift { 0%,100%{transform:translateY(0) rotate(-.15deg)} 50%{transform:translateY(-7px) rotate(.15deg)} }
    @keyframes mist-a { from{transform:translateX(-24px)} to{transform:translateX(32px)} }
    @keyframes mist-b { from{transform:translateX(34px)} to{transform:translateX(-26px)} }
    @keyframes wave { from{transform:translateX(-10px)} to{transform:translateX(12px)} }
    @keyframes twinkle { 0%,100%{opacity:.35} 50%{opacity:1} }
    @keyframes brume-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes flame { 0%,100%{transform:skewX(0) scaleY(1)} 35%{transform:skewX(-4deg) scaleY(1.04)} 70%{transform:skewX(4deg) scaleY(.97)} }
    @keyframes breathe { 0%,100%{transform:translateY(0) scaleY(1)} 50%{transform:translateY(-2px) scaleY(1.012)} }
    @keyframes blink { 0%,94%,100%{transform:scaleY(1)} 95%,97%{transform:scaleY(.1)} }
    @keyframes fire { from{transform:scale(.96,1) rotate(-2deg)} to{transform:scale(1.05,.94) rotate(2deg)} }
    @keyframes spark { 0%{opacity:0;transform:translateY(5px)} 20%{opacity:1} 100%{opacity:0;transform:translateY(-34px)} }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

