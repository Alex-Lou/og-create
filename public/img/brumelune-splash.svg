  <g class="campfire" transform="translate(450 435)" filter="url(#smallShadow)"><circle class="fire-glow" r="94" fill="url(#fireGlow)"/><path d="m-39 18 78-26m-77 1 77 27" stroke="#4f301e" stroke-width="12" stroke-linecap="round"/><g class="fire"><path d="M0 8c-30 0-34-27-18-51 10-14 14-25 18-43 7 20 20 30 24 47C32-14 22 8 0 8Z" fill="url(#fireOuter)" stroke="#763126" stroke-width="3"/><path d="M0 6c-16 0-20-15-10-29 5-8 8-14 10-25 5 12 13 18 14 29C18-5 12 6 0 6Z" fill="#fff076"/></g><g class="sparks" fill="#ffdf7d"><circle cx="-14" cy="-51" r="3"/><circle cx="13" cy="-42" r="2.5"/><circle cx="3" cy="-66" r="2"/><circle cx="-4" cy="-38" r="1.7"/></g></g>
  <g class="mist mist--front"><ellipse cx="286" cy="466" rx="252" ry="36" fill="url(#mist)"/><ellipse cx="688" cy="450" rx="231" ry="33" fill="url(#mist)"/></g><path class="near-wave" d="M-40 598q132-35 256-2t249 0 252 2 225-5" fill="none" stroke="#caedf0" stroke-opacity=".12" stroke-width="18" stroke-linecap="round"/>
  <rect x="8" y="8" width="884" height="634" rx="30" fill="none" stroke="#f9e7ad" stroke-opacity=".23" stroke-width="2"/><rect x="17" y="17" width="866" height="616" rx="24" fill="none" stroke="#78b9ca" stroke-opacity=".18"/>
  <style>
    .stars circle{animation:twinkle 4.8s ease-in-out infinite}.stars circle:nth-child(3n){animation-delay:-1.6s}.stars circle:nth-child(3n+2){animation-delay:-3.2s}.constellations{opacity:.23;animation:constellation 7s ease-in-out infinite}.moon-drift{transform-origin:450px 151px;animation:moon-drift 12s ease-in-out infinite}.waves{animation:waves 7s ease-in-out infinite alternate;transform-origin:450px 460px}.near-wave{animation:near-wave 8s ease-in-out infinite alternate}.mist{animation:mist 12s ease-in-out infinite alternate}.mist--front{animation-direction:alternate-reverse;animation-duration:15s}.lighthouse__beam{transform-origin:0 18px;animation:beam 7s ease-in-out infinite}.lanterns circle{animation:lantern 2.4s ease-in-out infinite}.lanterns circle:nth-child(2){animation-delay:-.8s}.lanterns circle:nth-child(3){animation-delay:-1.6s}.fire{animation:fire 1.25s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.fire-glow{animation:glow 2.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.sparks circle{animation:spark 2.1s ease-out infinite;transform-box:fill-box;transform-origin:center}.sparks circle:nth-child(2){animation-delay:-.6s}.sparks circle:nth-child(3){animation-delay:-1.15s}.sparks circle:nth-child(4){animation-delay:-1.7s}
    @keyframes twinkle{0%,100%{opacity:.42}50%{opacity:1}}@keyframes constellation{0%,100%{opacity:.14}50%{opacity:.33}}@keyframes moon-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes waves{from{transform:translateX(-12px) scaleY(.98)}to{transform:translateX(12px) scaleY(1.025)}}@keyframes near-wave{from{transform:translateX(-18px)}to{transform:translateX(18px)}}@keyframes mist{from{transform:translateX(-36px);opacity:.58}to{transform:translateX(36px);opacity:.96}}@keyframes beam{0%,100%{transform:rotate(-7deg);opacity:.38}50%{transform:rotate(15deg);opacity:.7}}@keyframes lantern{0%,100%{opacity:.62}50%{opacity:1}}@keyframes fire{0%,100%{transform:skewX(-2deg) scaleY(1)}42%{transform:skewX(5deg) scaleY(1.1)}72%{transform:skewX(-5deg) scaleY(.94)}}@keyframes glow{0%,100%{transform:scale(.93);opacity:.72}50%{transform:scale(1.1);opacity:1}}@keyframes spark{0%{transform:translateY(10px) scale(.5);opacity:0}24%{opacity:1}100%{transform:translateY(-31px) translateX(8px) scale(.1);opacity:0}}
    @media(prefers-reduced-motion:reduce){.stars circle,.constellations,.moon-drift,.waves,.near-wave,.mist,.lighthouse__beam,.lanterns circle,.fire,.fire-glow,.sparks circle{animation:none}}
  </style>
</svg>
