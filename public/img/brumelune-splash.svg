<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">L’île de Brumelune</title>
  <desc id="desc">Une île nocturne en relief, entourée de brume, de courants marins et de constellations.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09132e"/><stop offset=".56" stop-color="#19345a"/><stop offset="1" stop-color="#45728a"/></linearGradient>
    <radialGradient id="moon" cx="34%" cy="30%" r="68%"><stop offset="0" stop-color="#fffdf0"/><stop offset=".5" stop-color="#f9e9a9"/><stop offset="1" stop-color="#e4ba65"/></radialGradient>
    <radialGradient id="moonHalo"><stop offset="0" stop-color="#fff4c7" stop-opacity=".42"/><stop offset="1" stop-color="#d9eaff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#315e79"/><stop offset=".6" stop-color="#183d61"/><stop offset="1" stop-color="#0b2346"/></linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2=".75" y2="1"><stop offset="0" stop-color="#897055"/><stop offset=".48" stop-color="#5a493e"/><stop offset="1" stop-color="#2c2930"/></linearGradient>
    <linearGradient id="grass" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#8eb86a"/><stop offset=".46" stop-color="#5f985f"/><stop offset="1" stop-color="#315f53"/></linearGradient>
    <linearGradient id="shore" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4db9c"/><stop offset="1" stop-color="#c99d61"/></linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8edf2" stop-opacity="0"/><stop offset=".28" stop-color="#dff9f5" stop-opacity=".55"/><stop offset=".68" stop-color="#c9edf3" stop-opacity=".34"/><stop offset="1" stop-color="#b7dfe9" stop-opacity="0"/></linearGradient>
    <radialGradient id="fireGlow"><stop offset="0" stop-color="#ffd277" stop-opacity=".68"/><stop offset=".48" stop-color="#f08b43" stop-opacity=".22"/><stop offset="1" stop-color="#ef7a35" stop-opacity="0"/></radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#020817" flood-opacity=".55"/></filter>
    <filter id="smallShadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#020817" flood-opacity=".5"/></filter>
    <clipPath id="islandTop"><path d="M150 354Q205 257 332 229Q449 202 565 236Q685 271 750 358Q695 410 588 434Q460 463 329 438Q215 417 150 354Z"/></clipPath>
  </defs>
  <rect width="900" height="650" rx="36" fill="url(#sky)"/>
  <circle cx="450" cy="150" r="158" fill="url(#moonHalo)"/><circle cx="450" cy="151" r="91" fill="url(#moon)" stroke="#fff1ba" stroke-opacity=".6" stroke-width="3"/>
  <path d="M405 111q34-30 72-13-28 10-42 43-11-19-30-30ZM472 188q29-18 59 2-31 2-50 22-1-14-9-24Z" fill="#d5aa5b" opacity=".16"/>
  <g fill="#eaf6ff"><circle cx="95" cy="91" r="2.1" opacity=".82"/><circle cx="165" cy="137" r="1.4" opacity=".62"/><circle cx="229" cy="72" r="1.7" opacity=".9"/><circle cx="289" cy="129" r="1.1" opacity=".58"/><circle cx="619" cy="91" r="1.5" opacity=".76"/><circle cx="689" cy="151" r="2" opacity=".9"/><circle cx="784" cy="91" r="1.4" opacity=".7"/><circle cx="823" cy="193" r="1.2" opacity=".62"/></g>
  <g stroke="#eaf6ff" stroke-linecap="round" opacity=".88"><path d="M122 182h14m-7-7v14"/><path d="M735 116h12m-6-6v12"/><path d="M807 249h10m-5-5v10"/></g>
  <path d="M0 308Q83 281 174 307T354 305T540 304T720 299T900 304V650H0Z" fill="url(#sea)"/>
  <g class="waves" fill="none" stroke-linecap="round"><path d="M-40 374Q70 340 178 375T401 372T627 369T944 376" stroke="#c7edf0" stroke-opacity=".28" stroke-width="8"/><path d="M-20 442Q80 414 194 443T424 439T658 444T930 438" stroke="#89c9d7" stroke-opacity=".22" stroke-width="5"/><path d="M-30 526Q94 492 206 523T455 521T690 525T940 520" stroke="#bddfe8" stroke-opacity=".14" stroke-width="7"/></g>
  <ellipse cx="450" cy="414" rx="330" ry="76" fill="#06162e" opacity=".42"/>
