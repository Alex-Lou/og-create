# Blueprint Render : front statique + API Node (plan gratuit).
# La base PostgreSQL est hébergée hors Render (Neon/Supabase) : voir DEPLOY.md.
services:
  - type: web
    name: og-create
    runtime: static
    repo: https://github.com/Alex-Lou/og-create
    branch: master
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # L'API est servie sous la même adresse que le site (/api, relayée ci-dessous) :
      # indispensable aux cookies de session httpOnly SameSite=Strict
      - key: VUE_APP_API_URL
        value: /api
    routes:
      # 1. /api/* est relayé au backend (avant la règle de l'application, l'ordre compte)
      - type: rewrite
        source: /api/*
        destination: https://og-create-backend.onrender.com/api/*
      # 2. Tout le reste ouvre l'application
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: og-create-backend
    runtime: node
    plan: free
    repo: https://github.com/Alex-Lou/og-create-backend
    branch: main
    # db:setup applique schéma + contenu du jeu (idempotent ; ne touche pas aux comptes ni à la progression)
    buildCommand: npm ci && npm run db:setup
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Chaîne de connexion Neon/Supabase, avec ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # URL publique du front (pas de "*")
      - key: CORS_ORIGIN
        sync: false
      # Sauts de proxy de confiance pour lire l'adresse du joueur : le relais /api du site + celui de Render
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      # Formulaire de contact (facultatif)
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
