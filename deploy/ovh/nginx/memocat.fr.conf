# MemoCat (memocat.fr, dépôt Usy2) derrière le même Nginx que Brumelune. Seulement si Nginx ne sert pas déjà
# memocat.fr (deploy/ovh/README.md, « MemoCat », cas B et C) : sinon, garder son fichier actuel.
# MemoCat doit écouter le port 8080 de la machine, fermé à l'extérieur par le pare-feu.

server {
    listen 80;
    listen [::]:80;
    server_name memocat.fr www.memocat.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://memocat.fr$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name memocat.fr www.memocat.fr;

    ssl_certificate /etc/letsencrypt/live/memocat.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memocat.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Envois de fichiers : jusqu'à 11 Mo côté MemoCat (application.yml)
    client_max_body_size 12m;

    # Messagerie en direct (STOMP sur WebSocket, /ws) : la connexion reste ouverte
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
