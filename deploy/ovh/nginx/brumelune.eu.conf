# Brumelune (brumelune.eu) sur le VPS : le jeu (fichiers du build Vite, /var/www/brumelune) et son API (Node,
# 127.0.0.1:3000) sous la même adresse, indispensable aux cookies de session SameSite=Strict.
# Installation : deploy/ovh/README.md (à copier dans /etc/nginx/sites-available/, lien dans sites-enabled).
# Écrit pour Nginx 1.24 (Ubuntu 24.04) ; le certificat Let's Encrypt doit exister avant d'activer ce fichier.

# HTTP : seulement la preuve Let's Encrypt (certbot --webroot, renouvellement du certificat) ; tout le reste part
# en HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name brumelune.eu www.brumelune.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://brumelune.eu$request_uri;
    }
}

# www.brumelune.eu → brumelune.eu : une seule adresse, donc une seule session et un seul cache
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.brumelune.eu;

    ssl_certificate /etc/letsencrypt/live/brumelune.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brumelune.eu/privkey.pem;

    return 301 https://brumelune.eu$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brumelune.eu;

    ssl_certificate /etc/letsencrypt/live/brumelune.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brumelune.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:brumelune_ssl:10m;
    ssl_session_timeout 1d;

    root /var/www/brumelune;
    index index.html;

    # En-têtes de sécurité de la page (l'API ajoute les siens). Attention : un add_header dans une location
    # remplacerait tous ceux-ci pour elle ; les locations ci-dessous n'en ont donc aucun
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression : le code principal du jeu passe d'environ 800 Ko à 200 Ko
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # L'API : relayée au serveur Node, qui lit l'adresse du joueur dans X-Forwarded-For (TRUST_PROXY_HOPS=1 : un
    # seul relais, ce Nginx) pour ses limites de requêtes
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Fichiers du build : leur nom change à chaque version, ils sont gardés un an. Un fichier absent répond 404,
    # jamais la page du jeu (le service worker la garderait à sa place)
    location ~ ^/(js|css|fonts|img)/ {
        expires 1y;
        try_files $uri =404;
    }

    # Icônes, favicon, manifeste de l'appli : noms fixes, gardés un jour (le type du manifeste manque à Nginx 1.24)
    location ~ ^/(icons/|favicon\.ico$) {
        expires 1d;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires 1d;
        try_files $uri =404;
    }

    # Le service worker et la page : toujours revérifiés, une nouvelle version arrive dès le lancement suivant
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
    }

    # Tout le reste ouvre le jeu (lien de nouveau mot de passe /?reset=…, etc.)
    location / {
        try_files $uri /index.html;
    }
}
